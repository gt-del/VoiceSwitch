[package]
name = "voiceswitch_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "voiceswitch_core"
path = "src/lib.rs"

[[bin]]
name = "voiceswitch-core-cli"
path = "src/bin/voiceswitch-core-cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
